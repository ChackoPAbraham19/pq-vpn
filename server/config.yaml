mode: classical
host: 0.0.0.0
port: 14430
tun_name: tun0
tun_addr: 10.8.0.1/24
tun_net: 10.8.0.0/24
gateway: 10.8.0.1
dns: 10.8.0.1
tun_mtu: 1400
cert_dir: pki/certs/classical
groups: X25519MLKEM768
nat: true
outbound_iface: veth-ns1
persist_sysctl: false
dnsmasq: true
dns_upstream: 1.1.1.1
keepalive_interval: 15
handshake_timeout: 10   # reap slot claims that never complete mTLS (s)
welcome_rate: 1.0        # welcome-port token bucket: refill per second per source IP
welcome_burst: 3         # ... and burst size (a real client reconnects at 1-30 s backoff)
